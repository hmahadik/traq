# git-cliff configuration — generates categorized release notes from conventional commits.
# Used by .github/workflows/release.yml to produce the GitHub Release body.
# The "<!-- N -->" prefixes on group names control section order and are stripped in the template.
[changelog]
header = ""
body = """
{% if version %}## What's Changed in {{ version }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | split(pat="-->") | last | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat=":") | last | trim | upper_first }}{% if commit.scope %} _({{ commit.scope }})_{% endif %}
{%- endfor %}
{% endfor %}
{% if previous and previous.version %}
**Full Changelog**: https://github.com/hmahadik/traq/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactoring" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^revert", group = "<!-- 5 -->◀️ Reverts" },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = ".*", group = "<!-- 6 -->🔧 Other" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
